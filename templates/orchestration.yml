version: 5

default_profile: standard

agents:
  classifier:
    preferred: haiku
    mutates_code: false
  planner:
    preferred: opus
    mutates_code: false
  builder:
    preferred: sonnet
    mutates_code: true
  long_horizon:
    preferred: fable
    mutates_code: true
  figma_ingest:
    preferred: haiku_or_sonnet
    mutates_code: false
  regression:
    preferred: haiku
    mutates_code: false
  cleanup:
    preferred: haiku
    mutates_code: true
  ponytail:
    preferred: sonnet
    mutates_code: false
  pr_summarizer:
    preferred: haiku
    mutates_code: false
  arbiter:
    preferred: opus
    mutates_code: false

reviewers:
  low: none
  medium: balanced_codex
  high: strong_codex
  critical: extreme_codex
  security: strong_codex

pipeline:
  - phase: skill_routing
    tool: skills_engine
    policy: lazy_load_selected_only
  - phase: contract
    tool: pr_contract
  - phase: design_contract
    when: figma_enabled
    agent: figma_ingest
    tools: [figma_mcp, code_connect, context_governor]
  - phase: structural_impact
    tool: code_review_graph
    outputs: [blast_radius, affected_flows, test_gaps, structural_risk]
  - phase: context_plan
    tools: [code_review_graph, graphify, codegraph, context_governor]
  - phase: plan
    when: risk >= high
    agent: planner
  - phase: implement
    agent: builder
  - phase: verify_behavior
    tools: [rtk]
  - phase: regression_scout
    agent: regression
  - phase: targeted_test_fix
    when: regression_risk_confirmed
    agent: builder
  - phase: adversarial_review
    when: risk >= medium
    agent: codex_reviewer
    context_source: code_review_graph_minimal_review_set
    sandbox: read_only
  - phase: security_gate
    when: security_boundary == true
    agent: security_reviewer
  - phase: fix_confirmed_findings
    when: confirmed_findings_exist
    agent: builder
  - phase: verify_behavior_after_fixes
    when: fixes_ran
    tools: [rtk]
  - phase: cleanup
    agent: cleanup
  - phase: cleanup_diff_budget_check
    tool: diff_budget
  - phase: verify_after_cleanup
    tools: [rtk]
  - phase: provenance_gate_before_quality
    tool: provenance_scan
  - phase: ponytail
    agent: ponytail
  - phase: design_fidelity
    when: figma_enabled
    owner: ponytail
  - phase: quality_fix
    when: ponytail_failed
    agent: builder
  - phase: cleanup_after_quality_fix
    when: quality_fix_ran
    agent: cleanup
  - phase: final_verification
    when: quality_fix_ran
    tools: [rtk]
  - phase: ponytail_final
    when: quality_fix_ran
    agent: ponytail
  - phase: pr_summary
    when: pr_ready == true
    agent: pr_summarizer
  - phase: provenance_gate_final_artifacts
    when: pr_ready == true
    tool: provenance_scan

limits:
  max_adversarial_reviews: 1
  max_quality_fix_rounds: 1
  max_findings: 5
  max_nonblocking_quality_notes: 3
  max_cleanup_lines: 100
  max_cleanup_ratio_of_original_diff: 0.15
  diff_first: true
  broad_repo_crawl: false
  model_debate_loops: false
  progressive_context: true
  one_tool_per_question: true
  cache_before_fetch: true
  pass_output: minimal

human_required:
  - destructive_or_irreversible_change
  - unresolved_security_tradeoff
  - unresolved_architecture_disagreement
  - requirement_ambiguity_changes_product_behavior
  - budget_exceeded_with_unresolved_high_or_critical_issue

pr_ready_requires:
  - pr_contract_satisfied
  - relevant_checks_pass
  - no_unresolved_high_or_critical_correctness_findings
  - conditional_security_gate_passed_or_not_required
  - cleanup_pass
  - cleanup_diff_budget_ok
  - provenance_scan_pass
  - ponytail_pass
  - design_fidelity_pass_or_not_required
