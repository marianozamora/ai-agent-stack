version: 1

profiles:
  fast:
    intent: low-cost, low-risk iteration
    classifier: haiku
    planner: none
    builder: sonnet
    correctness_reviewer: none
    cleanup: haiku
    ponytail: sonnet
    regression: haiku
    pr_summarizer: haiku
    max_agent_calls: 3
    max_escalations: 1
    max_review_rounds: 0
    full_suite: false

  standard:
    intent: default daily development
    classifier: haiku
    planner: conditional_opus
    builder: sonnet
    correctness_reviewer: terra
    cleanup: haiku
    ponytail: sonnet
    regression: haiku
    pr_summarizer: haiku
    max_agent_calls: 5
    max_escalations: 2
    max_review_rounds: 1
    full_suite: false

  strict:
    intent: high-risk or release-critical change
    classifier: haiku
    planner: opus
    builder: sonnet
    correctness_reviewer: sol
    cleanup: haiku
    ponytail: sonnet
    regression: haiku
    pr_summarizer: haiku
    max_agent_calls: 7
    max_escalations: 2
    max_review_rounds: 2
    full_suite: true
