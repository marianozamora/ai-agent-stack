version: 1

# Hard context caps keep agents from turning a focused change into a repo crawl.
defaults:
  raw_files_max: 8
  review_files_max: 12
  raw_file_lines_max: 500
  findings_max: 5
  broad_repo_crawl: false
  require_justification_to_expand: true

profiles:
  fast:
    raw_files_max: 4
    review_files_max: 6
    max_agent_calls: 3
    max_escalations: 1
    max_review_rounds: 0
  standard:
    raw_files_max: 8
    review_files_max: 12
    max_agent_calls: 5
    max_escalations: 2
    max_review_rounds: 1
  strict:
    raw_files_max: 12
    review_files_max: 18
    max_agent_calls: 7
    max_escalations: 2
    max_review_rounds: 2

expansion_policy:
  allowed_reasons:
    - concrete unresolved finding
    - dependency edge shown by CodeGraph
    - failing test requiring implementation detail
    - high-risk invariant or security boundary
  forbidden_reasons:
    - curiosity
    - broad style review
    - speculative refactor
    - rereading information already in context
