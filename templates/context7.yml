context7:
  mode: cli_first
  mcp: optional
  cache_library_ids: true
  cache_docs_queries: true
  version_source_priority:
    - lockfile
    - package_manifest
    - project_profile
    - context7_latest
  query_policy:
    only_for_external_library_api: true
    prefer_exact_library_id: true
    prefer_installed_version: true
    broad_docs_dump: false
  budgets:
    fast: 1
    standard: 3
    strict: 5
