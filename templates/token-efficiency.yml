version: 1
principles:
  - lazy_skill_loading
  - progressive_context
  - one_tool_per_question
  - diff_first
  - evidence_before_reasoning
  - cache_before_fetch
  - compact_handoffs
  - compact_pass_outputs
  - no_model_debate_loops
  - evidence_driven_escalation
profiles:
  fast:
    max_agent_calls: 3
    max_skills: 1
    max_raw_files: 4
    max_review_files: 5
    max_findings: 3
    max_context7_queries: 1
    max_review_rounds: 0
  standard:
    max_agent_calls: 5
    max_skills: 2
    max_raw_files: 8
    max_review_files: 10
    max_findings: 3
    max_context7_queries: 3
    max_review_rounds: 1
  strict:
    max_agent_calls: 7
    max_skills: 3
    max_raw_files: 12
    max_review_files: 15
    max_findings: 5
    max_context7_queries: 5
    max_review_rounds: 1
stop_conditions:
  repeated_failed_approach: escalate_or_needs_human
  unresolved_high_risk_after_budget: needs_human
  passing_gate: no_explanation_unless_requested
