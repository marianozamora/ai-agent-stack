version: 1

# Final PR hygiene: remove accidental agent/model provenance from deliverables.
strict_agent_names: true

names:
  - Claude
  - Codex
  - ChatGPT

provenance_phrases:
  - AI-generated
  - generated by AI
  - generated by Claude
  - generated by Codex
  - generated by ChatGPT
  - written by Claude
  - written by Codex
  - written by ChatGPT
  - reviewed by Claude
  - reviewed by Codex

exclude_paths:
  - .ai-review/
  - CLAUDE.md
  - AGENTS.md
  - bin/ai
  - bin/ai-

# Use this for legitimate product/integration references that must remain.
allow_regex: []

commit_messages:
  scan: true
  strict_agent_names: true
  reject_coauthor_agent_markers: true

pr_artifacts:
  scan: true
  strict_agent_names: true
