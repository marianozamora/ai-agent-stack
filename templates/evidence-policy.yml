version: 1

priority:
  - deterministic_test
  - static_analysis
  - reproducible_failure
  - codegraph_dependency_evidence
  - direct_source_evidence
  - model_reasoning

confidence:
  default_minimum: 0.80
  security_or_data_loss_minimum: 0.65
  style_blocker_minimum: 0.90

rules:
  blocker_requires_concrete_location: true
  blocker_requires_material_impact: true
  speculative_findings_are_non_blocking: true
  test_or_reproduction_beats_model_disagreement: true
  unresolved_model_disagreement_requires_arbiter_or_human: true
