# Packaging + tooling config.
#
# Packaging is deliberately "incremental": `pip install` builds a standard
# distribution and exposes the `ai` console entry point, but ai_stack/ keeps its
# flat, same-directory imports (`import core`) rather than switching to a package
# namespace with relative imports. cli.py prepends its own directory to sys.path
# so the entry point and the four existing script-style invocation paths
# (bin/ai, the test harness, and the two subprocess re-execs in gates.py and
# benchmark.py) all resolve the sibling modules the same way. A full package
# migration (relative imports + `python -m ai_stack.cli` everywhere + migrating
# already-installed validators.json commands) was scoped out as not worth the
# blast radius at v0.9.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-stack"
version = "0.9.4"  # keep in sync with the VERSION file
description = "Zero-footprint, token-aware orchestration layer for Claude Code + Codex over existing repositories"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
ai = "ai_stack.cli:main"

[project.optional-dependencies]
# `pip install -e ".[dev]"` - what CI and contributors run the suite with.
dev = ["pytest", "pytest-xdist", "coverage[toml]"]

[tool.setuptools]
packages = ["ai_stack"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["tests/__pycache__"]

[tool.ruff.lint]
# Real correctness/bug lints only, permanently. This project deliberately keeps
# a terse, compact style throughout (semicolon-joined statements, one-line
# function bodies) rather than the PEP8-expanded default `ruff format`/black
# would produce - see the decision recorded in ci.yml's `format-check` step
# and docs/architecture.md. Style/formatting rules are intentionally never
# enabled here.
select = ["F", "E9", "B", "UP"]
ignore = [
    "E402",   # module-level import not at top (cli.py sets sys.path first today)
    "E501",   # long lines are this project's actual style, not unformatted code
]
# B904 (raise ... from) and F841 (unused locals) are fully fixed as of the
# cleanup pass that followed the cli.py split - no ignores needed for either.
# Style codes (E1/E2/E7, multi-statement lines, import sorting) are never
# selected at all - this project's terse style is intentional, not unformatted.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]

[tool.ruff.format]
# Deliberately never run against this tree - see the decision recorded in
# ci.yml's `format-check` step. Kept configured only so `ruff format --check`
# has settings to compare against if anyone runs it manually.

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Flat-module layout: ai_stack/ is an installable package but its modules import
# siblings by bare name (`import skills`). These three keys let mypy resolve those
# the same way the runtime does, so its output is real type findings instead of
# spurious "module has no attribute" noise.
mypy_path = "ai_stack"
explicit_package_bases = true
namespace_packages = true
# Type checking is blocking in CI. Add annotations at JSON/dict boundaries
# instead of suppressing whole error classes.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
# ABSOLUTE source path, not a bare "ai_stack": the suite runs the CLI as
# `python ai_stack/cli.py` from throwaway sandbox CWDs and its modules import
# each other by flat name (`import core`), so neither a CWD-relative `source`
# nor `source_pkgs = ["ai_stack"]` (flat names aren't under an `ai_stack.`
# package) would match a subprocess. AI_STACK_ROOT is the repo root - CI sets it;
# it also rides through to subprocesses via the inherited env. Unset, it falls
# back to "." (in-process measurement still works from the repo root; subprocess
# hits are simply not counted).
source = ["${AI_STACK_ROOT-.}/ai_stack"]
parallel = true    # each `ai` subprocess writes its own .coverage.<host>.<pid> file
sigterm = true     # flush data when a spawned CLI child is killed by SIGTERM
# The data file MUST live OUTSIDE this repo tree. The suite spawns throwaway git
# sandboxes and tests/test_workflow.py hashes untracked files for its
# evidence-fingerprint / contamination checks - a stray .coverage.* landing in a
# sandbox breaks them. CI sets COVERAGE_FILE=${{ runner.temp }}/cov/.coverage;
# run it locally the same way (COVERAGE_FILE=/tmp/cov/.coverage). Subprocess
# instrumentation is wired via a cov_subprocess.pth in site-packages plus
# COVERAGE_PROCESS_START=<abs path to this file> in the job env.

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
