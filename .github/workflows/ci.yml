name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff==0.15.21 mypy
      - run: ruff check .
      - run: mypy ai_stack
      - run: python3 scripts/generate_command_reference.py --check
      - run: ruff format --check --diff .
        continue-on-error: true  # permanently advisory, by decision, not a pending TODO: this project
                                  # keeps its terse, compact style (semicolons, one-line bodies) on
                                  # purpose, and ruff format's PEP8-expanded output would rewrite the
                                  # entire ~2500-line codebase in one diff for a style preference, not
                                  # a bug. Left running (never blocking) only as an informational signal.

  # Fast, blocking PR signal: in-process units plus install/entry-point smoke.
  quick-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e ".[dev]"
      - run: python3 tests/validate.py
      - run: python3 -m pytest -q --ignore=tests/test_workflow.py
      - run: bash tests/package_smoke.sh
      - run: bash tests/smoke.sh

  # Subprocess-heavy end-to-end coverage runs after merge, weekly, or on demand.
  full-matrix:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python3 -m pytest -n auto -q --ignore=tests/test_workflow.py
      # This end-to-end file temporarily exercises source-level prompt variants;
      # keep it isolated from xdist workers to avoid cross-test filesystem races.
      - run: python3 -m pytest -q tests/test_workflow.py

  # Insurance for the "runs as a plain script, stdlib only" contract the pyproject.toml
  # header calls out: no editable install, no pytest, just the unittest discovery path.
  unittest:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 tests/validate.py
      - run: python3 -m unittest discover -s tests

  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # COVERAGE_FILE MUST sit outside the repo tree: the suite spawns throwaway git
      # sandboxes and test_workflow.py hashes untracked files for its evidence-fingerprint
      # / contamination checks - a stray .coverage.* inside a sandbox breaks them.
      COVERAGE_FILE: ${{ runner.temp }}/cov/.coverage
      COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
      # Absolute source root for [tool.coverage.run]; rides through to the CLI
      # subprocesses via their inherited env so their hits are counted too.
      AI_STACK_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e ".[dev]"
      - name: Instrument subprocesses
        # A .pth in site-packages runs coverage.process_startup() on every interpreter
        # start, so the many `ai` CLI subprocess calls in the suite are counted too.
        run: python -c "import sysconfig,pathlib; pathlib.Path(sysconfig.get_paths()['purelib'],'cov_subprocess.pth').write_text('import coverage; coverage.process_startup()')"
      - run: mkdir -p ${{ runner.temp }}/cov
      - run: coverage run -m pytest -q
      - run: coverage combine
      - run: coverage report -m
      - run: coverage xml
      # ratchet floor - raise as coverage improves; do not lower
      # (full suite + subprocess instrumentation measures ~86% locally; 5pt headroom)
      - run: coverage report --fail-under=81
